[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:napcat]
command=/app/napcat/NapCat/launcher.sh
directory=/app/napcat/NapCat
autostart=true
autorestart=true
stdout_logfile=/var/log/napcat.log
stderr_logfile=/var/log/napcat.error.log
environment=HOME="/root"

[program:nonebot]
command=/app/qq-bot/venv/bin/python bot.py
directory=/app/qq-bot
autostart=true
autorestart=true
stdout_logfile=/var/log/nonebot.log
stderr_logfile=/var/log/nonebot.error.log
environment=PYTHONUNBUFFERED="1",WIKI_PATH="/app/wiki",RAW_PATH="/app/raw",SKILL_PATH="/app/skill",AGENT_PATH="/app/agent"
